[package]
name = "mediainfo-rust"
version = "0.1.0"
edition = "2021"
description = "Cleanroom pure-Rust reimplementation of MediaInfo (library + CLI, no GUI)"
license = "BSD-2-Clause"
repository = "https://github.com/sandwichfarm/mediainfo-rust"
rust-version = "1.80"

[lib]
name = "mediainfo"
path = "src/lib.rs"

[[bin]]
name = "mediainfo"
path = "src/main.rs"

[dependencies]

[dev-dependencies]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = false
