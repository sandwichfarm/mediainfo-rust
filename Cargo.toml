[package]
name = "mediainfo-rust"
version = "0.1.0"
edition = "2021"
description = "Cleanroom pure-Rust reimplementation of MediaInfo (library + CLI, no GUI)"
license = "BSD-2-Clause"
repository = "https://github.com/sandwichfarm/mediainfo-rust"
readme = "README.md"
keywords = ["mediainfo", "media", "metadata", "video", "audio"]
categories = ["multimedia", "multimedia::video", "multimedia::audio", "command-line-utilities", "parser-implementations"]
rust-version = "1.80"
# Keep the crate small: the reference corpus, oracle dumps and helper tool stay in git only.
exclude = ["tests/fixtures/*", "tests/oracle/*", "tools/*", "docs/*", ".github/*", ".claude/*"]

[lib]
name = "mediainfo"
path = "src/lib.rs"

[[bin]]
name = "mediainfo"
path = "src/main.rs"

[dependencies]

[dev-dependencies]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = false
